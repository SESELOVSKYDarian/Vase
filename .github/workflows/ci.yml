name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vase_validation
      AUTH_SECRET: test-secret-not-for-production
      SERVICE_TO_SERVICE_TOKEN: ci-service-token
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test V3 contracts and structure
        run: npm run test:v3

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Validate Prisma schemas
        shell: bash
        run: |
          for schema in apps/*/prisma/schema.prisma; do
            npx prisma validate --schema "$schema"
          done
