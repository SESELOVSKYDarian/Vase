# Bases de datos y servicios para probar Vase en tu computadora. Nada de esto toca producción.
# Se maneja con: npm run local:setup | local:dev | local:down | local:reset (ver docs/pruebas-locales.md).
name: vase-local

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: vase-local
      MYSQL_DATABASE: vase
      MYSQL_USER: vase
      MYSQL_PASSWORD: vase-local
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pvase-local"]
      interval: 5s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vase
      POSTGRES_PASSWORD: vase-local
      POSTGRES_DB: vase_business
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vase -d vase_business"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]

  # Atrapa todos los mails que mandan las apps: se ven en http://localhost:8025 y no le llegan a nadie.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mysql-data:
  postgres-data:
