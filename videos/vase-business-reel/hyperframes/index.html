<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=block');
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #06140d; }
      #root { position: relative; width: 100%; height: 100%; font-family: Inter, system-ui, sans-serif; color: #f8faf8; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      #glow { background: radial-gradient(900px 900px at 50% 40%, rgba(0,109,67,0.6), transparent 70%); }
      #grid {
        background-image: linear-gradient(rgba(71,224,152,0.07) 2px, transparent 2px), linear-gradient(90deg, rgba(71,224,152,0.07) 2px, transparent 2px);
        background-size: 90px 90px;
      }
      #ring { inset: auto; left: 340px; top: 180px; width: 400px; height: 400px; border-radius: 50%; border: 8px solid #47e098; }
      #logo { inset: auto; left: 440px; top: 300px; width: 200px; filter: invert(1) brightness(2); }
      .line { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; letter-spacing: -4px; line-height: 1; }
      #l1 { top: 640px; font-size: 124px; }
      #l2 { top: 770px; font-size: 124px; color: #47e098; }
      #sub { position: absolute; top: 960px; left: 110px; right: 110px; text-align: center; font-size: 48px; font-weight: 600; color: #bbf5d6; line-height: 1.25; }
      #cta {
        position: absolute; top: 1160px; left: 50%; width: 820px; margin-left: -410px; padding: 38px 0;
        border-radius: 999px; background: #47e098; color: #06140d; text-align: center; font-size: 58px; font-weight: 900;
        box-shadow: 0 0 0 0 rgba(71,224,152,0.6);
      }
      #cta small { display: block; font-size: 30px; font-weight: 800; letter-spacing: 4px; margin-bottom: 6px; }
      #web { position: absolute; top: 1420px; left: 0; right: 0; text-align: center; font-size: 52px; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="glow" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
      <div id="grid" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
      <div id="ring" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
      <img id="logo" class="clip" src="vase-logo.png" alt="Vase" data-start="0" data-duration="5" data-track-index="3" />
      <div id="copy" class="clip" data-start="0" data-duration="5" data-track-index="4">
        <div id="l1" class="line">Tu negocio,</div>
        <div id="l2" class="line">online en días.</div>
        <div id="sub">Escribinos y te mostramos<br />Vase Business con tu marca.</div>
        <div id="cta"><small>CONSULTANOS POR WHATSAPP</small>+54 9 223 449-6403</div>
        <div id="web">vase.ar</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('#grid', { backgroundPosition: '0px 0px' }, { backgroundPosition: '0px 180px', duration: 5, ease: 'none' }, 0);
      tl.fromTo('#ring', { scale: 0.4, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 1.1, ease: 'power2.out' }, 0);
      tl.fromTo('#logo', { scale: 0, rotation: -25 }, { scale: 1, rotation: 0, duration: 0.7, ease: 'back.out(2)' }, 0.05);
      tl.fromTo('#l1', { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: 'power3.out' }, 0.3);
      tl.fromTo('#l2', { y: 120, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: 'back.out(1.6)' }, 0.45);
      tl.fromTo('#sub', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: 'power2.out' }, 0.8);
      tl.fromTo('#cta', { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: 'back.out(2.2)' }, 1.1);
      tl.to('#cta', { scale: 1.05, boxShadow: '0 0 0 36px rgba(71,224,152,0)', duration: 0.45, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 1.8);
      tl.fromTo('#web', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4 }, 1.4);
      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
